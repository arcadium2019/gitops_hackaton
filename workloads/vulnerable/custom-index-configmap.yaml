apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-index
  namespace: demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arcadium Vault - Banque Sécurisée</title>
        <style>
            :root {
                --primary: #2563eb;
                --primary-dark: #1d4ed8;
                --bg-dark: #0f172a;
                --bg-card: rgba(30, 41, 59, 0.7);
                --text-light: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #10b981;
                --danger: #ef4444;
            }
            
            body {
                margin: 0;
                padding: 0;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg-dark);
                color: var(--text-light);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background-image: 
                    radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.15), transparent 25%),
                    radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
            }

            header {
                background: rgba(15, 23, 42, 0.8);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid rgba(255,255,255,0.1);
                padding: 1rem 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: sticky;
                top: 0;
                z-index: 10;
            }

            .logo {
                font-size: 1.5rem;
                font-weight: 800;
                letter-spacing: -0.5px;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            
            .logo-icon {
                color: var(--primary);
            }

            .nav-links {
                display: flex;
                gap: 2rem;
            }

            .nav-links a {
                color: var(--text-muted);
                text-decoration: none;
                font-weight: 500;
                transition: color 0.2s;
            }

            .nav-links a:hover {
                color: var(--text-light);
            }

            .btn-login {
                background: var(--primary);
                color: white;
                border: none;
                padding: 0.5rem 1.5rem;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s;
            }

            .btn-login:hover {
                background: var(--primary-dark);
                transform: translateY(-1px);
            }

            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                text-align: center;
                position: relative;
            }

            .hero-badge {
                background: rgba(16, 185, 129, 0.1);
                color: var(--accent);
                padding: 0.5rem 1rem;
                border-radius: 99px;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
                border: 1px solid rgba(16, 185, 129, 0.2);
                animation: pulse 2s infinite;
            }

            h1 {
                font-size: 4rem;
                font-weight: 800;
                margin: 0 0 1.5rem 0;
                line-height: 1.1;
                background: linear-gradient(to right, #fff, #94a3b8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .subtitle {
                font-size: 1.25rem;
                color: var(--text-muted);
                max-width: 600px;
                margin: 0 auto 3rem auto;
                line-height: 1.6;
            }

            .dashboard-preview {
                background: var(--bg-card);
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 16px;
                padding: 2rem;
                width: 100%;
                max-width: 800px;
                backdrop-filter: blur(16px);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                text-align: left;
                transform: translateY(0);
                transition: transform 0.3s ease;
            }
            
            .dashboard-preview:hover {
                transform: translateY(-5px);
            }

            .account-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 2rem;
                padding-bottom: 1rem;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }

            .balance-label {
                font-size: 0.875rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .balance-amount {
                font-size: 3rem;
                font-weight: 700;
                margin: 0;
            }

            .transaction-list {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .transaction {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;
                background: rgba(255,255,255,0.03);
                border-radius: 8px;
            }

            .tx-info {
                display: flex;
                flex-direction: column;
            }

            .tx-title {
                font-weight: 600;
            }

            .tx-date {
                font-size: 0.875rem;
                color: var(--text-muted);
            }

            .tx-amount.positive { color: var(--accent); }
            .tx-amount.negative { color: var(--text-light); }

            @keyframes pulse {
                0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
                70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
                100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
            }
            
            /* The "vulnerability" hint */
            .admin-link {
                position: fixed;
                bottom: 10px;
                right: 10px;
                font-size: 10px;
                color: rgba(255,255,255,0.1);
                text-decoration: none;
            }
            .admin-link:hover { color: var(--danger); }

            /* Modal Styles */
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(5px);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 100;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .modal-overlay.active {
                opacity: 1;
                pointer-events: all;
            }

            .modal-content {
                background: var(--bg-dark);
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 12px;
                padding: 2rem;
                width: 90%;
                max-width: 400px;
                transform: translateY(20px);
                transition: transform 0.3s ease;
            }

            .modal-overlay.active .modal-content {
                transform: translateY(0);
            }

            .modal-title {
                margin-top: 0;
                margin-bottom: 1.5rem;
                font-size: 1.5rem;
            }

            .form-group {
                margin-bottom: 1rem;
                text-align: left;
            }

            .form-group label {
                display: block;
                margin-bottom: 0.5rem;
                color: var(--text-muted);
                font-size: 0.875rem;
            }

            .form-group input {
                width: 100%;
                padding: 0.75rem;
                border-radius: 6px;
                border: 1px solid rgba(255,255,255,0.2);
                background: rgba(0,0,0,0.2);
                color: white;
                box-sizing: border-box;
                font-family: inherit;
            }

            .form-group input:focus {
                outline: none;
                border-color: var(--primary);
            }

            .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 1rem;
                margin-top: 2rem;
            }

            .btn-cancel {
                background: transparent;
                border: 1px solid rgba(255,255,255,0.2);
                color: white;
                padding: 0.5rem 1rem;
                border-radius: 6px;
                cursor: pointer;
            }

            .btn-cancel:hover {
                background: rgba(255,255,255,0.1);
            }

            .success-msg {
                color: var(--accent);
                display: none;
                margin-top: 1rem;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">
                <span class="logo-icon">▲</span> Arcadium Vault
            </div>
            <nav class="nav-links">
                <a href="#">Particuliers</a>
                <a href="#">Entreprises</a>
                <a href="#">Patrimoine</a>
            </nav>
            <button class="btn-login">Espace Client</button>
        </header>

        <main>
            <div class="hero-badge">Protocole de Sécurité Militaire Actif</div>
            <h1>Sécurisez votre avenir.</h1>
            <p class="subtitle">L'expérience bancaire digitale nouvelle génération, sans compromis sur la sécurité. Vos actifs, protégés par une cryptographie de pointe.</p>

            <div class="dashboard-preview">
                <div class="account-header">
                    <div>
                        <div class="balance-label">Solde Total (EUR)</div>
                        <h2 class="balance-amount" id="balance">€2,459,201.50</h2>
                    </div>
                    <button class="btn-login" id="btn-transfer" style="background: rgba(255,255,255,0.1);">Virement</button>
                </div>
                
                <div class="transaction-list" id="tx-list">
                    <div class="transaction">
                        <div class="tx-info">
                            <span class="tx-title">Virement SWIFT - Crypto Exchange</span>
                            <span class="tx-date">Aujourd'hui, 14:23</span>
                        </div>
                        <span class="tx-amount negative">-€50,000.00</span>
                    </div>
                    <div class="transaction">
                        <div class="tx-info">
                            <span class="tx-title">Dépôt Dividendes - Tech Index</span>
                            <span class="tx-date">Hier</span>
                        </div>
                        <span class="tx-amount positive">+€12,450.00</span>
                    </div>
                </div>
            </div>
        </main>
        
        <a href="#" class="admin-link">/admin-bypass</a>

        <div class="modal-overlay" id="transfer-modal">
            <div class="modal-content">
                <h3 class="modal-title">Nouveau Virement</h3>
                <form id="transfer-form">
                    <div class="form-group">
                        <label>IBAN du bénéficiaire</label>
                        <input type="text" placeholder="FR76 1234 5678..." required>
                    </div>
                    <div class="form-group">
                        <label>Montant (€)</label>
                        <input type="number" id="transfer-amount" placeholder="0.00" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Motif</label>
                        <input type="text" id="transfer-reason" placeholder="Facture, Loyer...">
                    </div>
                    <div class="success-msg" id="success-msg">Virement envoyé avec succès !</div>
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="btn-cancel">Annuler</button>
                        <button type="submit" class="btn-login" id="btn-submit">Confirmer</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            const modal = document.getElementById('transfer-modal');
            const btnTransfer = document.getElementById('btn-transfer');
            const btnCancel = document.getElementById('btn-cancel');
            const form = document.getElementById('transfer-form');
            const successMsg = document.getElementById('success-msg');
            const btnSubmit = document.getElementById('btn-submit');
            const txList = document.getElementById('tx-list');
            const balanceEl = document.getElementById('balance');

            let currentBalance = 2459201.50;

            btnTransfer.addEventListener('click', () => {
                modal.classList.add('active');
                successMsg.style.display = 'none';
                form.reset();
                btnSubmit.style.display = 'block';
            });

            btnCancel.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const amount = parseFloat(document.getElementById('transfer-amount').value);
                const reason = document.getElementById('transfer-reason').value || 'Virement sortant';
                
                if(amount > 0 && amount <= currentBalance) {
                    // Update balance
                    currentBalance -= amount;
                    balanceEl.textContent = '€' + currentBalance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    
                    // Add transaction
                    const txHtml = `
                    <div class="transaction">
                        <div class="tx-info">
                            <span class="tx-title">${reason}</span>
                            <span class="tx-date">À l'instant</span>
                        </div>
                        <span class="tx-amount negative">-€${amount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                    </div>`;
                    txList.insertAdjacentHTML('afterbegin', txHtml);

                    // Show success
                    btnSubmit.style.display = 'none';
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        modal.classList.remove('active');
                    }, 2000);
                } else {
                    alert('Fonds insuffisants ou montant invalide.');
                }
            });
        </script>
    </body>
    </html>
