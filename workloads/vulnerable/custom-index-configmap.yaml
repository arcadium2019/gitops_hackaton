apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-index
  namespace: demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arcadium Vault - Secure Banking</title>
        <style>
            :root {
                --primary: #2563eb;
                --primary-dark: #1d4ed8;
                --bg-dark: #0f172a;
                --bg-card: rgba(30, 41, 59, 0.7);
                --text-light: #f8fafc;
                --text-muted: #94a3b8;
                --accent: #10b981;
                --danger: #ef4444;
            }
            
            body {
                margin: 0;
                padding: 0;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg-dark);
                color: var(--text-light);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                background-image: 
                    radial-gradient(circle at 15% 50%, rgba(37, 99, 235, 0.15), transparent 25%),
                    radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1), transparent 25%);
            }

            header {
                background: rgba(15, 23, 42, 0.8);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid rgba(255,255,255,0.1);
                padding: 1rem 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: sticky;
                top: 0;
                z-index: 10;
            }

            .logo {
                font-size: 1.5rem;
                font-weight: 800;
                letter-spacing: -0.5px;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            
            .logo-icon {
                color: var(--primary);
            }

            .nav-links {
                display: flex;
                gap: 2rem;
            }

            .nav-links a {
                color: var(--text-muted);
                text-decoration: none;
                font-weight: 500;
                transition: color 0.2s;
            }

            .nav-links a:hover {
                color: var(--text-light);
            }

            .btn-login {
                background: var(--primary);
                color: white;
                border: none;
                padding: 0.5rem 1.5rem;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s, transform 0.1s;
            }

            .btn-login:hover {
                background: var(--primary-dark);
                transform: translateY(-1px);
            }

            main {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
                text-align: center;
            }

            .hero-badge {
                background: rgba(16, 185, 129, 0.1);
                color: var(--accent);
                padding: 0.5rem 1rem;
                border-radius: 99px;
                font-size: 0.875rem;
                font-weight: 600;
                margin-bottom: 1.5rem;
                border: 1px solid rgba(16, 185, 129, 0.2);
                animation: pulse 2s infinite;
            }

            h1 {
                font-size: 4rem;
                font-weight: 800;
                margin: 0 0 1.5rem 0;
                line-height: 1.1;
                background: linear-gradient(to right, #fff, #94a3b8);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .subtitle {
                font-size: 1.25rem;
                color: var(--text-muted);
                max-width: 600px;
                margin: 0 auto 3rem auto;
                line-height: 1.6;
            }

            .dashboard-preview {
                background: var(--bg-card);
                border: 1px solid rgba(255,255,255,0.1);
                border-radius: 16px;
                padding: 2rem;
                width: 100%;
                max-width: 800px;
                backdrop-filter: blur(16px);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                text-align: left;
                transform: translateY(0);
                transition: transform 0.3s ease;
            }
            
            .dashboard-preview:hover {
                transform: translateY(-5px);
            }

            .account-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-bottom: 2rem;
                padding-bottom: 1rem;
                border-bottom: 1px solid rgba(255,255,255,0.05);
            }

            .balance-label {
                font-size: 0.875rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            .balance-amount {
                font-size: 3rem;
                font-weight: 700;
                margin: 0;
            }

            .transaction-list {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .transaction {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;
                background: rgba(255,255,255,0.03);
                border-radius: 8px;
            }

            .tx-info {
                display: flex;
                flex-direction: column;
            }

            .tx-title {
                font-weight: 600;
            }

            .tx-date {
                font-size: 0.875rem;
                color: var(--text-muted);
            }

            .tx-amount.positive { color: var(--accent); }
            .tx-amount.negative { color: var(--text-light); }

            @keyframes pulse {
                0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
                70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
                100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
            }
            
            /* The "vulnerability" hint */
            .admin-link {
                position: fixed;
                bottom: 10px;
                right: 10px;
                font-size: 10px;
                color: rgba(255,255,255,0.1);
                text-decoration: none;
            }
            .admin-link:hover { color: var(--danger); }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">
                <span class="logo-icon">▲</span> Arcadium Vault
            </div>
            <nav class="nav-links">
                <a href="#">Personal</a>
                <a href="#">Business</a>
                <a href="#">Wealth</a>
            </nav>
            <button class="btn-login">Client Portal</button>
        </header>

        <main>
            <div class="hero-badge">Military-Grade Security Protocol Active</div>
            <h1>Secure Your Future.</h1>
            <p class="subtitle">Experience next-generation digital banking with uncompromising security. Your assets, protected by advanced cryptography.</p>

            <div class="dashboard-preview">
                <div class="account-header">
                    <div>
                        <div class="balance-label">Total Balance (USD)</div>
                        <h2 class="balance-amount">$2,459,201.50</h2>
                    </div>
                    <button class="btn-login" style="background: rgba(255,255,255,0.1);">Transfer</button>
                </div>
                
                <div class="transaction-list">
                    <div class="transaction">
                        <div class="tx-info">
                            <span class="tx-title">Wire Transfer - Crypto Exchange</span>
                            <span class="tx-date">Today, 14:23</span>
                        </div>
                        <span class="tx-amount negative">-$50,000.00</span>
                    </div>
                    <div class="transaction">
                        <div class="tx-info">
                            <span class="tx-title">Dividend Deposit - Tech Index</span>
                            <span class="tx-date">Yesterday</span>
                        </div>
                        <span class="tx-amount positive">+$12,450.00</span>
                    </div>
                </div>
            </div>
        </main>
        
        <a href="#" class="admin-link">/admin-bypass</a>
    </body>
    </html>
